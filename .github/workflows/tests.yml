name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Run on all three because the plugin claims to behave identically
    # anywhere Python runs, and path handling is the obvious place for that
    # claim to be wrong. The boundary checks compare paths without touching
    # the filesystem for exactly this reason; this is what verifies it.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install pytest
        # pytest only, and the suite itself checks that nothing else was
        # needed. If anything has to be added here, the plugin has acquired a
        # dependency and the portability claim in the README has stopped
        # being true.
        run: python -m pip install --quiet pytest

      - name: Run the tests
        run: python -m pytest skills/zepteach/tests -q
